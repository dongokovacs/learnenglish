<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angol jelzők – gyakorló</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<main class="auth-screen" id="authScreen" aria-labelledby="authTitle">
  <section class="auth-panel">
    <p class="auth-kicker">ANGOL GYAKORLÓ</p>
    <h1 id="authTitle">Ki tanul ma?</h1>
    <p class="auth-lead" id="authLead">Válaszd ki a profilodat a folytatáshoz.</p>

    <div class="profile-grid" id="profilePicker" hidden>
      <button class="profile-tile" type="button" data-profile="dani">
        <span class="profile-avatar profile-avatar--dani" aria-hidden="true"><span>DA</span></span>
        <span class="profile-name">Dani</span>
      </button>
      <button class="profile-tile" type="button" data-profile="demo">
        <span class="profile-avatar profile-avatar--demo" aria-hidden="true"><span>DE</span></span>
        <span class="profile-name">Demo</span>
      </button>
    </div>

    <form class="login-form" id="loginForm" hidden>
      <button class="back-button" id="backToProfiles" type="button">Vissza a profilokhoz</button>
      <div class="login-profile">
        <span class="profile-avatar" id="selectedAvatar" aria-hidden="true"></span>
        <h2 id="selectedName"></h2>
      </div>
      <label for="password">Jelszó</label>
      <input class="password-input" id="password" type="password" name="password" autocomplete="current-password" required>
      <p class="auth-error" id="authError" role="alert" hidden></p>
      <button class="login-button" id="loginButton" type="submit">Belépés</button>
    </form>

    <p class="auth-status" id="authStatus" role="status" aria-live="polite">A belépés ellenőrzése…</p>
  </section>
</main>

<div class="wrap" id="appShell" hidden>
  <div class="app-account">
    <span class="app-account-name" id="activeUserName"></span>
    <button class="account-switch" id="switchUser" type="button">Fiókváltás</button>
  </div>
  <h1>Angol jelzők</h1>
  <p class="sub">Jellemzők, hétköznapi és tesztelői szavak. Napi 10 perc.</p>

  <div class="tabs" role="tablist">
    <button role="tab" data-mode="card" aria-selected="true">Kártyák</button>
    <button role="tab" data-mode="quiz" aria-selected="false">Kvíz</button>
    <button role="tab" data-mode="exam" aria-selected="false">Vizsga</button>
    <button role="tab" data-mode="list" aria-selected="false">Lista</button>
    <button role="tab" data-mode="say" aria-selected="false">Kiejtés</button>
  </div>

  <div class="filters">
    <select id="cat" aria-label="Kategória"></select>
    <select id="dir" aria-label="Irány">
      <option value="en2hu">Angol → magyar</option>
      <option value="hu2en">Magyar → angol</option>
    </select>
  </div>

  <p class="note" id="note" hidden></p>
  <section class="stat" aria-label="Haladás">
    <div class="stat-top">
      <div class="stat-num" id="statNum"></div>
      <div class="stat-pct" id="statPct"></div>
    </div>
    <div class="bar" id="bar" role="img"><i class="s-ok" id="bOk"></i><i class="s-due" id="bDue"></i></div>
    <div class="legend">
      <span><i class="dot s-ok"></i>Tudod: <b id="lOk">0</b></span>
      <span><i class="dot s-due"></i>Ismétlésre vár: <b id="lDue">0</b></span>
      <span><i class="dot s-new"></i>Még nem: <b id="lNew">0</b></span>
    </div>
    <p class="progress" id="prog" hidden></p>
    <details class="cats" id="cats">
      <summary>Kategóriánként</summary>
      <div id="catRows"></div>
    </details>
  </section>

  <main id="view"></main>

  <p class="foot">A haladásod és az ismétlési időpontok csak ebben a böngészőben mentődnek. <button id="reset">Haladás törlése</button></p>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
